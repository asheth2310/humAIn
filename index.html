<body class="first-visit">
<div class="opening-reveal" aria-hidden="true"><div class="opening-reveal-inner"><span>GrandVillage</span><i></i><small>Care, close to home.</small></div></div>
<a class="skip" href="#app">Skip to content</a>
<div class="scroll-progress" aria-hidden="true"></div>
<div class="demo-ribbon">Interactive product demo — fictional profiles, test payments, and simulated verification only</div>
<header><div class="header-inner"><nav class="nav" id="mainNav" aria-label="Main navigation"></nav><div class="role-switch" aria-label="Demo role switcher"><span>View as</span><button data-role="visitor">Visitor</button><button data-role="parent">Parent</button><button data-role="host">Host</button></div><div class="theme-switch" role="group" aria-label="Color theme"><button type="button" data-theme-opt="light" aria-pressed="false">Light</button><button type="button" data-theme-opt="system" aria-pressed="true">System</button><button type="button" data-theme-opt="dark" aria-pressed="false">Dark</button></div><div class="text-size-switch" role="group" aria-label="Text size"><button type="button" data-ts="dec" aria-label="Decrease text size">A&minus;</button><span class="ts-label" aria-hidden="true">100%</span><button type="button" data-ts="inc" aria-label="Increase text size">A+</button></div></div></header>

<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script src="assets/three-r128.min.js"></script>
<script src="app.js"></script>
<script>(function(){var KEY="gv-text-size",STEPS=[90,100,112,125],root=document.documentElement;
function cur(){try{var v=parseInt(localStorage.getItem(KEY),10);return STEPS.indexOf(v)>=0?v:100}catch(e){return 100}}
function paint(v){root.style.zoom=(v/100);try{localStorage.setItem(KEY,String(v))}catch(e){}
var ls=document.querySelectorAll('.text-size-switch .ts-label');for(var i=0;i<ls.length;i++){ls[i].textContent=v+"%"}}
document.addEventListener("click",function(e){var b=e.target&&e.target.closest?e.target.closest("[data-ts]"):null;if(!b)return;
var v=cur(),i=STEPS.indexOf(v);if(b.getAttribute("data-ts")==="inc"&&i<STEPS.length-1){paint(STEPS[i+1])}
else if(b.getAttribute("data-ts")==="dec"&&i>0){paint(STEPS[i-1])}});
paint(cur());})();</script></body>
</html>
